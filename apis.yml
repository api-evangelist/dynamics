name: Dynamics
description: 'Dynamics Inc designs and manufactures battery-powered interactive payment cards that work
  with existing point-of-sale and card infrastructure. Its "Computer-in-a-Card" technology embeds a
  microprocessor, buttons, and a rewritable magnetic stripe into a standard-size card, enabling programmable
  multi-account cards, hidden card numbers, and on-card loyalty for banks, merchants, and consumers.
  The company is a fintech hardware manufacturer backed by Bain Capital Ventures. As of this profile it
  publishes no public developer API, SDK, or documentation surface; this repository tracks its identity
  and public security posture in the API Evangelist network.'
